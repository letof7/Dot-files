general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Baisse la luminosité de l'écran après 2 minutes et 30 secondes
listener {
    timeout = 50
    on-timeout = hyprctl hyprsunset gamma 20
    on-resume = hyprctl hyprsunset gamma 100
}

# Verrouille la session et éteint l'écran après 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session && hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Met le système en veille après 30 minutes
listener {
    timeout = 72000
    on-timeout = systemctl suspend
}
